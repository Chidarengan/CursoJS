<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Somando Números</title>
<style>
    
        body{
            background-color: rgb(14, 153, 153);
            color: white;
            font: normal 18pt Arial;
        }
        #mais{
            font: normal 30pt Arial;
            color: white;
            margin-left: 75px;
        }
</style>

</head>
<body>

    <h1>Somando Valores</h1>
    <input type="number" name="txtn1" id="txtn1" > <br>
    <p id = "mais" >+</p> 
    <input type="number" name="txtn2" id="txtn2"> <br>
    <input type="button" value="Somar" onclick="somar()"> <br>
    <h2 id ="res" >Resultado: </h2>



    <script>

        function somar(){
            var tn1 = window.document.getElementById('txtn1')
            var tn2 = window.document.querySelector('input#txtn2') //jeito diferente de fazer a mesma coisa
            var res = window.document.getElementById('res')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var s = n1 + n2
            res.innerHTML = `A soma entre ${n1} e ${n2} é igual a <strong>${s}</strong> ` 
        }

    </script>

    
</body>
</html>
